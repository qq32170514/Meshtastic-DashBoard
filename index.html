<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meshtastic Real-time Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #f0f2f5; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 900px; margin: auto; }
        h1 { color: #1a73e8; text-align: center; }
        .controls { text-align: center; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        select { padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 1em; }
        #status { font-size: 0.9em; color: #666; }
        .status-tag { padding: 2px 8px; border-radius: 4px; font-size: 0.8em; margin-left: 5px; }
        .online { background: #e6fffa; color: #2d3748; border: 1px solid #38b2ac; }
        .log-container { margin-top: 20px; background: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 8px; font-family: 'Courier New', Courier, monospace; font-size: 0.85em; }
        .log-title { margin-bottom: 10px; font-weight: bold; border-bottom: 1px solid #7f8c8d; padding-bottom: 5px; display: flex; justify-content: space-between; }
        #packetLog { height: 150px; overflow-y: auto; list-style: none; padding: 0; margin: 0; }
        #packetLog li { margin-bottom: 4px; border-left: 3px solid #3498db; padding-left: 8px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📡 Meshtastic 數據監控</h1>
        <div class="controls">
            <label for="nodeSelector">監控節點：</label>
            <select id="nodeSelector">
                <option value="">-- 請選擇節點 --</option>
            </select>
            <span id="status">Dashboard: 正在連線...</span>
            <span id="mqttStatus" class="status-tag">MQTT: 檢測中</span>
        </div>
        <canvas id="telemetryChart"></canvas>

        <!-- 新增的日誌小視窗 -->
        <div class="log-container">
            <div class="log-title"><span>📡 即時通訊日誌</span><span id="packetCount">已收到: 0</span></div>
            <ul id="packetLog"><li>等待封包中...</li></ul>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('telemetryChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: '電池電量 (%)', borderColor: '#2ecc71', backgroundColor: 'rgba(46, 204, 113, 0.1)', data: [], yAxisID: 'y', tension: 0.4, fill: true },
                    { label: '溫度 (°C)', borderColor: '#e74c3c', data: [], yAxisID: 'y1', tension: 0.4 }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    y: { type: 'linear', position: 'left', title: { display: true, text: '電量 %' }, min: 0, max: 100 },
                    y1: { type: 'linear', position: 'right', title: { display: true, text: '溫度 °C' }, grid: { drawOnChartArea: false } }
                }
            }
        });

        let currentNodeId = '';

        // 1. 載入節點清單
        async function refreshNodeList() {
            const res = await fetch('/api/nodes');
            const nodes = await res.json();
            const selector = document.getElementById('nodeSelector');
            const currentValue = selector.value;
            
            selector.innerHTML = '<option value="">-- 請選擇節點 --</option>';
            nodes.forEach(node => {
                const opt = document.createElement('option');
                opt.value = node;
                opt.textContent = node;
                selector.appendChild(opt);
            });
            if (nodes.includes(currentValue)) selector.value = currentValue;
        }

        // 2. 切換節點歷史資料
        async function loadNodeHistory(nodeId) {
            if (!nodeId) return;
            const res = await fetch(`/api/telemetry?node_id=${encodeURIComponent(nodeId)}&limit=30`);
            const data = await res.json();
            
            // 清空舊圖表數據
            chart.data.labels = [];
            chart.data.datasets.forEach(d => d.data = []);
            
            data.reverse().forEach(item => updateChart(item, true));
            chart.update();
        }

        document.getElementById('nodeSelector').addEventListener('change', (e) => {
            currentNodeId = e.target.value;
            loadNodeHistory(currentNodeId);
        });

        // 2. 監聽 Socket.io 即時更新
        const socket = io();
        socket.on('telemetry_update', (data) => {
            console.log('收到新數據:', data);
            updateChart(data);
        });

        // 監聽 MQTT 連線狀態
        socket.on('mqtt_status', (data) => {
            const el = document.getElementById('mqttStatus');
            el.innerText = data.connected ? 'MQTT: 已連線' : 'MQTT: 斷線';
            el.className = data.connected ? 'status-tag online' : 'status-tag';
        });

        // 監聽所有原始封包
        let pCount = 0;
        socket.on('raw_packet', (data) => {
            const logList = document.getElementById('packetLog');
            if (pCount === 0) logList.innerHTML = ''; // 移除等待文字
            
            pCount++;
            document.getElementById('packetCount').innerText = `已收到: ${pCount}`;

            const li = document.createElement('li');
            li.innerHTML = `[${data.time}] 來自 <strong>${data.from}</strong> 的封包 (Port: ${data.portnum})`;
            logList.insertBefore(li, logList.firstChild);

            // 限制日誌數量，避免瀏覽器變慢
            if (logList.childNodes.length > 50) logList.removeChild(logList.lastChild);
        });

        function updateChart(data, isBatch = false) {
            // 如果前端有選定節點，且收到的資料不是該節點，則忽略
            if (currentNodeId && data.node_id !== currentNodeId) return;

            const label = new Date(data.timestamp).toLocaleTimeString();
            
            // 避免重複加入相同時間點的資料
            if (chart.data.labels.includes(label)) return;

            chart.data.labels.push(label);
            chart.data.datasets[0].data.push(data.battery_level);
            chart.data.datasets[1].data.push(data.temperature);

            // 保持顯示最近 20 筆
            if (chart.data.labels.length > 20) {
                chart.data.labels.shift();
                chart.data.datasets.forEach(d => d.data.shift());
            }
            if (!isBatch) chart.update('none');
        }

        // 初始化
        refreshNodeList();
        setInterval(refreshNodeList, 30000); // 每 30 秒更新一次節點選單
        document.getElementById('status').innerText = '✅ 即時連線中';
    </script>
</body>
</html>
